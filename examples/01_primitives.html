<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>01 — Image Swap AR</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          // 【修改点1：设置扫描目标为图像2】
          // 请根据你的实际文件位置调整（如果 2.png 在 Targets 文件夹里，则是 ../assets/Targets/2.png）
          "imagePath": "../assets/Targets/2.png", 
          "properties": {
            "left": 0, "top": 0,
            // 【重要提示】：请将下方的数值修改为 2.png 的真实像素宽高
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <!-- 【修改点2：预加载需要显示出来的图像1】 -->
    <a-assets>
      <img id="image1" src="../assets/Targets/1.jpg">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <!-- 识别到扫描目标时触发的容器 -->
    <xrextras-named-image-target name="my-poster">

      <!-- 【修改点3：将原本的一堆3D物体删除，替换为要呈现的图像1】 -->
      <!-- position="0 0 0" 表示刚好贴合在扫描图上。-->
      <!-- width 和 height 请根据 1.jpg 的实际比例进行调整（例如图是竖版的，可以设为 width="1" height="1.5"） -->
      <a-image src="#image1" position="0 0 0" width="1" height="1"></a-image>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
