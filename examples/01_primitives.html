<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Image Sequence Player</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- 注册图片序列播放组件 -->
  <script>
    AFRAME.registerComponent('sequence-player', {
      init: function () {
        const targetEl = this.el;
        const targetName = targetEl.getAttribute('name'); // 获取当前配置的目标名称
        const frames = ['#frame1', '#frame2', '#frame3', '#frame4', '#frame5'];
        let timer = null;

        // 监听整个场景的识别事件，这比单纯监听元素更为稳妥
        this.el.sceneEl.addEventListener('xrimagefound', (event) => {
          // 确保只在识别到对应的 my-poster 时才触发播放
          if (event.detail.name !== targetName) return;

          // 在事件触发时动态获取子级 a-image 元素，避免因加载顺序导致找不到元素
          const imageEl = targetEl.querySelector('a-image');
          if (!imageEl) return;

          let currentFrame = 0;
          imageEl.setAttribute('src', frames[currentFrame]);

          if (timer) clearInterval(timer);

          // 开启 0.3 秒定时器
          timer = setInterval(() => {
            currentFrame++;
            if (currentFrame < frames.length) {
              imageEl.setAttribute('src', frames[currentFrame]);
            } else {
              clearInterval(timer);
              timer = null;
            }
          }, 300);
        });

        // 失去追踪时清理定时器
        this.el.sceneEl.addEventListener('xrimagelost', (event) => {
          if (event.detail.name !== targetName) return;
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        });
      }
    });
  </script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/1.jpg", 
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830, 
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- 请确保这里的 5 张图片都是 368x480 尺寸 -->
      <img id="frame1" src="../assets/Targets/1.jpg">
      <img id="frame2" src="../assets/frame2.jpg">
      <img id="frame3" src="../assets/frame3.jpg">
      <img id="frame4" src="../assets/frame4.jpg">
      <img id="frame5" src="../assets/frame5.jpg">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="my-poster" sequence-player>

      <!-- 调整后的 a-image：通过 width="1" height="1.304" 保持 368x480 的比例，不再被压扁 -->
      <a-image src="#frame1" position="0 0 0" width="1" height="1.304"></a-image>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
