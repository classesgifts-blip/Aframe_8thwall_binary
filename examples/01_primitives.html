<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Image Sequence Player</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- 注册无缝图片播放组件 -->
  <script>
    AFRAME.registerComponent('sequence-player', {
      init: function () {
        const targetEl = this.el;
        const targetName = targetEl.getAttribute('name');
        let timer = null;

        this.el.sceneEl.addEventListener('xrimagefound', (event) => {
          if (event.detail.name !== targetName) return;

          // 获取当前目标下的所有 a-image 元素
          const images = Array.from(targetEl.querySelectorAll('a-image'));
          if (images.length === 0) return;

          // 初始状态：全部隐藏
          images.forEach(img => img.setAttribute('visible', false));

          let currentFrame = 0;
          // 显示第一帧
          images[currentFrame].setAttribute('visible', true);

          if (timer) clearInterval(timer);

          // 开启定时器，无缝切换 visible 状态
          timer = setInterval(() => {
            // 隐藏上一帧
            images[currentFrame].setAttribute('visible', false);
            currentFrame++;

            if (currentFrame < images.length) {
              // 显示当前帧
              images[currentFrame].setAttribute('visible', true);
            } else {
              // 播放结束，保持显示最后一帧
              images[images.length - 1].setAttribute('visible', true);
              clearInterval(timer);
              timer = null;
            }
          }, 600);
        });

        this.el.sceneEl.addEventListener('xrimagelost', (event) => {
          if (event.detail.name !== targetName) return;
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        });
      }
    });
  </script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/2.jpg", 
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830, 
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- 【重要】：请仔细核对以下 5 个图片路径，确保在 Firebase 资源管理器中可以正常打开 -->
      <img id="frame1" src="../assets/Targets/1.jpg">
      <img id="frame2" src="../assets/Targets/2.jpg">
      <img id="frame3" src="../assets/Targets/3.jpg">
      <img id="frame4" src="../assets/Targets/4.jpg">
      <img id="frame5" src="../assets/Targets/5.jpg">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <!-- 挂载播放组件 -->
    <xrextras-named-image-target name="my-poster" sequence-player>

      <!-- 创建 5 个重叠的图片层，初始状态均设为 visible="false" -->
      <a-image src="#frame1" position="0 0 0" width="1" height="1.304" visible="false"></a-image>
      <a-image src="#frame2" position="0 0 0" width="1" height="1.304" visible="false"></a-image>
      <a-image src="#frame3" position="0 0 0" width="1" height="1.304" visible="false"></a-image>
      <a-image src="#frame4" position="0 0 0" width="1" height="1.304" visible="false"></a-image>
      <a-image src="#frame5" position="0 0 0" width="1" height="1.304" visible="false"></a-image>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
